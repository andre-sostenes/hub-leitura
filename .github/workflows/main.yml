name: Test e Publicar Resultados

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  pages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes com Cypress
        run: npx cypress run --reporter json --reporter-options "outputFile=cypress-results.json" 2>&1 || true

      - name: Criar diretório de resultado
        if: always()
        run: |
          mkdir -p test-results
          if [ -f cypress-results.json ]; then
            cp cypress-results.json test-results/
          fi
          echo "✅ Testes executados" > test-results/index.html

      - name: Deploy para GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./test-results
          force_orphan: true
